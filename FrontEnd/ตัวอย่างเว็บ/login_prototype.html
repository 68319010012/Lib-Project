<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — ห้องสมุดวิทยาลัยเทคนิคนครนายก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7a2734; --maroon-dark:#5c1c26; --orange:#e0672e;
    --green:#4a7c3f; --purple:#8b5fa3; --ink:#1f2328; --gray:#6b7280;
    --gray-light:#9aa1ab; --border:#e5e7eb; --bg:#f5f6f8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Noto Sans Thai','Segoe UI',sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  .topbar{background:#fff; border-bottom:1px solid var(--border);}
  .topbar-inner{max-width:960px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:10px;}
  .logo-box{width:36px; height:36px; border-radius:10px; background:var(--maroon); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand-title{font-weight:700; font-size:15px; color:var(--ink); line-height:1.2;}
  .brand-sub{font-size:11px; color:var(--gray); letter-spacing:.03em;}

  .hero{
    position:relative; overflow:hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.10), transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(0,0,0,0.18), transparent 50%),
      linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.045) 0 2px, transparent 2px 34px),
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.10), transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(0,0,0,0.18), transparent 50%),
      linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%);
  }
  .hero-inner{max-width:960px; margin:0 auto; padding:56px 24px 112px; text-align:center;}
  .eyebrow{font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:#f3c6b0; margin-bottom:12px;}
  .hero h1{color:#fff; font-size:32px; font-weight:800; line-height:1.3;}

  main{max-width:420px; margin:-80px auto 0; padding:0 24px 64px; position:relative;}
  .card{background:#fff; border-radius:18px; box-shadow:0 20px 45px -12px rgba(31,35,40,0.25); border:1px solid #f1f1f1; overflow:hidden;}

  .tabs{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px; background:#f0f1f3;}
  .tab{border:none; border-radius:12px; padding:11px 0; font-size:14px; font-weight:700; cursor:pointer; transition:all .2s;}
  .tab-active{background:var(--maroon); color:#fff; box-shadow:0 4px 14px -4px rgba(122,39,52,.5);}
  .tab-idle{background:transparent; color:var(--gray);}

  form{padding:24px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;}
  .field input{width:100%; border-radius:12px; border:1px solid var(--border); background:#f9fafb; padding:13px 16px; font-size:15px; color:var(--ink); font-family:inherit; transition:.2s;}
  .field input::placeholder{color:#b0b5bd;}
  .field input:focus{outline:3px solid var(--orange); outline-offset:2px; background:#fff; border-color:var(--maroon);}

  .btn-primary{
    width:100%; background:var(--orange); color:#fff; font-weight:700; font-size:15px;
    border:none; border-radius:12px; padding:14px 0; cursor:pointer; margin-top:6px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .15s, box-shadow .15s;
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 10px 20px -8px rgba(224,103,46,.5);}
  .btn-primary:active{transform:translateY(0) scale(.98);}

  .reg-line{text-align:center; font-size:14px; color:var(--gray); padding:0 24px 24px;}
  .reg-line a{color:var(--maroon); font-weight:700; text-decoration:none;}

  .stats-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:24px;}
  .stat-card{background:#fff; border-radius:14px; border:1px solid #f1f1f1; box-shadow:0 2px 8px rgba(31,35,40,.05); padding:16px 10px; text-align:center;}
  .stat-icon{width:40px; height:40px; border-radius:9999px; display:flex; align-items:center; justify-content:center; margin:0 auto 10px;}
  .stat-card p{font-size:11.5px; font-weight:600; color:#4b5563; line-height:1.35;}

  @keyframes riseIn{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  .rise-in{animation:riseIn .6s cubic-bezier(.2,.7,.3,1) both;}
  .fade-in{animation:fadeIn .8s ease both;}
</style>
</head>
<body>

  <div class="topbar fade-in">
    <div class="topbar-inner">
      <div class="logo-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <div>
        <p class="brand-title">ห้องสมุดวิทยาลัยเทคนิคนครนายก</p>
        <p class="brand-sub">Nakhon Nayok Technical College Library</p>
      </div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-inner">
      <p class="eyebrow mono fade-in">Check-in / Check-out System</p>
      <h1 class="rise-in">ระบบเช็คอิน–เช็คเอาท์<br>การเข้าใช้ห้องสมุด</h1>
    </div>
  </div>

  <main>
    <div class="card rise-in" style="animation-delay:.1s">
      <div class="tabs" role="tablist">
        <button id="tabStudent" class="tab tab-active" onclick="setRole('student')">นักศึกษา</button>
        <button id="tabAdmin" class="tab tab-idle" onclick="setRole('admin')">เจ้าหน้าที่</button>
      </div>

      <form onsubmit="return false;">
        <div class="field">
          <label id="labelUser">รหัสนักศึกษา</label>
          <input id="username" type="text" placeholder="เช่น 68319010012">
        </div>
        <div class="field">
          <label>รหัสผ่าน</label>
          <input type="password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          เข้าสู่ระบบ
        </button>
      </form>
      <p id="registerLine" class="reg-line">ยังไม่มีบัญชี? <a href="register_prototype.html">สมัครสมาชิก</a></p>
    </div>

    <div class="stats-row rise-in" style="animation-delay:.2s">
      <div class="stat-card">
        <div class="stat-icon" style="background:#fbe9e2;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e0672e" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </div>
        <p>นักศึกษา<br>1,406 คน</p>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#eaf1e8;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a7c3f" stroke-width="2.2" stroke-linecap="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
        </div>
        <p>เปิดบริการ<br>08:00–17:00</p>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#f3e9f7;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b5fa3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <p>14 แผนกวิชา<br>ใช้บริการ</p>
      </div>
    </div>
  </main>

<script>
function setRole(role){
  const tabStudent=document.getElementById('tabStudent'), tabAdmin=document.getElementById('tabAdmin');
  const labelUser=document.getElementById('labelUser'), username=document.getElementById('username');
  const registerLine=document.getElementById('registerLine');
  if(role==='student'){
    tabStudent.className='tab tab-active'; tabAdmin.className='tab tab-idle';
    labelUser.textContent='รหัสนักศึกษา'; username.placeholder='เช่น 68319010012';
    registerLine.style.display='block';
  } else {
    tabAdmin.className='tab tab-active'; tabStudent.className='tab tab-idle';
    labelUser.textContent='ชื่อผู้ใช้'; username.placeholder='ชื่อผู้ใช้เจ้าหน้าที่';
    registerLine.style.display='none';
  }
}
</script>
</body>
</html>
