<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ห้องสมุด NNTC</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&family=IBM+Plex+Mono:wght@100..900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      // Anti-flash: set the dark/light class before paint. 'nntc-theme-mode'
      // is 'auto' (time-of-day: dark 18:00–06:00) | 'light' | 'dark', set by
      // components/ThemeMenu.jsx. Falls back to system preference only if
      // neither this nor the older 'nntc-theme' key (pre-ThemeMenu) exists.
      (function () {
        try {
          var mode = localStorage.getItem('nntc-theme-mode');
          var dark;
          if (mode === 'dark') {
            dark = true;
          } else if (mode === 'light') {
            dark = false;
          } else if (mode === 'auto') {
            var hour = new Date().getHours();
            dark = hour >= 18 || hour < 6;
          } else {
            var legacy = localStorage.getItem('nntc-theme');
            dark = legacy ? legacy === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('light', !dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
