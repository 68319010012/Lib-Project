<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <!-- maskable: พื้นหลังไล่เฉดเดียวกับโลโก้เดิม แต่เต็มสี่เหลี่ยมจัตุรัสแทน
       วงกลม (เพราะ Android จะตัดเข้ารูปเองอีกที) แล้วหดลายเส้นหนังสือลงมา
       ~74% อยู่ในวง safe-zone ตรงกลาง กันโดนตัดขอบ -->
  <rect x="0" y="0" width="200" height="200" fill="url(#bg)"/>
  <g transform="translate(100 100) scale(0.74) translate(-100 -100)"
     fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 72 C 88 63 68 59 46 63 L 46 132 C 68 128 88 132 100 141" />
    <path d="M100 72 C 112 63 132 59 154 63 L 154 132 C 132 128 112 132 100 141" />
    <path d="M100 72 L 100 141" />
    <path d="M58 80 L 84 76" stroke-width="4" opacity=".85"/>
    <path d="M58 94 L 88 90" stroke-width="4" opacity=".85"/>
    <path d="M58 108 L 84 105" stroke-width="4" opacity=".85"/>
    <path d="M142 80 L 116 76" stroke-width="4" opacity=".85"/>
    <path d="M142 94 L 112 90" stroke-width="4" opacity=".85"/>
    <path d="M142 108 L 116 105" stroke-width="4" opacity=".85"/>
  </g>
</svg>
