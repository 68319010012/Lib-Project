  <!-- ไอคอน maskable: พื้นหลังเต็มสี่เหลี่ยมจัตุรัส ไม่มีมุมโค้งเอง เพราะระบบ
       ปฏิบัติการ (Android) จะตัดเป็นวงกลม/สี่เหลี่ยมมุมมนตามธีมเครื่องอีกที
       เนื้อไอคอนจึงต้องหด/ขยับเข้ามาให้อยู่ในวงกลม "safe zone" (เส้นผ่านศูนย์
       กลาง 80% ของภาพ) ไม่งั้นขอบหนังสือจะโดนตัดหายไปในบางเครื่อง -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

