<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22335c"/>
      <stop offset="1" stop-color="#141f38"/>
    </linearGradient>
  </defs>
  <!-- พื้นหลัง: กรมเข้มไล่เฉด ตรงกับสีแบรนด์หลักของเว็บ (#1a2947) -->
  <rect x="0" y="0" width="512" height="512" rx="0" fill="url(#bg)"/>

  <!-- หนังสือเปิด วาดเป็นเวกเตอร์เอง ให้เข้าธีมเดียวกับไอคอน local_library
       ที่ใช้อยู่ในแถบหัวเว็บจริง (ไม่ใช่ตราวิทยาลัยที่ไม่เกี่ยวกับหน้าตาเว็บ) -->
  <g>
    <!-- สันหนังสือ -->
    <rect x="250" y="158" width="12" height="222" rx="4" fill="#ffffff" opacity="0.95"/>

    <!-- หน้าซ้าย -->
    <path d="M256 176
             C 210 162, 160 160, 120 172
             C 112 175, 108 181, 108 189
             L 108 348
             C 108 357, 116 363, 125 361
             C 163 352, 208 354, 256 372
             Z"
          fill="#ffffff"/>

    <!-- หน้าขวา -->
    <path d="M256 176
             C 302 162, 352 160, 392 172
             C 400 175, 404 181, 404 189
             L 404 348
             C 404 357, 396 363, 387 361
             C 349 352, 304 354, 256 372
             Z"
          fill="#ffffff"/>

    <!-- เส้นบรรทัดจำลองตัวอักษรบนหน้าซ้าย -->
    <path d="M132 208 C 165 200, 200 201, 230 212" stroke="#22335c" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55"/>
    <path d="M132 236 C 165 228, 200 229, 230 240" stroke="#22335c" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55"/>
    <path d="M132 264 C 165 256, 200 257, 230 268" stroke="#22335c" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55"/>

    <!-- เส้นบรรทัดจำลองตัวอักษรบนหน้าขวา -->
    <path d="M380 208 C 347 200, 312 201, 282 212" stroke="#22335c" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55"/>
    <path d="M380 236 C 347 228, 312 229, 282 240" stroke="#22335c" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55"/>
    <path d="M380 264 C 347 256, 312 257, 282 268" stroke="#22335c" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55"/>

    <!-- คั่นหน้าสีทอง จุดเด่นเล็ก ๆ ให้ไอคอนมีสีที่สอง ไม่จืดเกินไป -->
    <path d="M256 372 L 256 430 L 238 414 L 220 430 L 220 380 Z" fill="#e0b355"/>
  </g>
</svg>
