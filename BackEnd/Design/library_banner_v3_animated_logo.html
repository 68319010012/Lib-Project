<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner — ห้องสมุดวิทยาลัยเทคนิคนครนายก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#2a1216;}
  .banner{
    position:relative; width:100%; max-width:1440px; height:500px; margin:0 auto; overflow:hidden;
    font-family:'Noto Sans Thai','Segoe UI',sans-serif;
    background:
      radial-gradient(circle at 82% 20%, rgba(255,255,255,0.08), transparent 45%),
      radial-gradient(circle at 6% 90%, rgba(0,0,0,0.2), transparent 45%),
      linear-gradient(135deg, #8a2f3d 0%, #7a2734 55%, #4a151d 100%);
  }
  .banner::before{
    content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 34px);
    animation: driftLines 42s linear infinite;
  }
  @keyframes driftLines{ from{background-position-x:0;} to{background-position-x:680px;} }

  .top-stripe{position:absolute; top:0; left:0; width:100%; height:5px;
    background:linear-gradient(90deg,#f2c96b,#c9962c,#f2c96b); background-size:200% 100%;
    animation: shimmerBar 6s linear infinite;}
  @keyframes shimmerBar{ from{background-position-x:0%;} to{background-position-x:-200%;} }

  .dotgrid{position:absolute; top:34px; right:70px; display:grid; grid-template-columns:repeat(7,10px); gap:6px;}
  .dotgrid span{width:3px; height:3px; border-radius:50%; background:#fff; opacity:.35; animation:dotPulse 3s ease-in-out infinite;}
  @keyframes dotPulse{0%,100%{opacity:.15;} 50%{opacity:.55;}}

  .divider{position:absolute; left:52%; top:70px; bottom:70px; width:1px; background:rgba(255,255,255,.08);}

  .content{position:relative; z-index:2; padding:34px 56px; height:100%;}
  .logo-row{display:flex; align-items:center; gap:16px; opacity:0; animation:fadeUp .7s ease .1s forwards;}
  .logo-badge{
    width:88px; height:88px; border-radius:9999px; background:#fff; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; box-shadow:0 8px 24px -6px rgba(20,5,8,.5);
    border:2.5px solid; border-image:linear-gradient(135deg,#f2c96b,#c9962c) 1;
    animation: logoGlow 3.4s ease-in-out infinite;
  }
  @keyframes logoGlow{0%,100%{box-shadow:0 8px 24px -6px rgba(20,5,8,.5);} 50%{box-shadow:0 8px 30px -4px rgba(242,201,107,.55);}}
  .logo-badge img{width:82px; height:82px; border-radius:9999px; object-fit:cover;}

  .eyebrow{font-size:12.5px; font-weight:700; letter-spacing:.1em; color:#f3c6b0; text-transform:uppercase;}
  .brand{font-size:16px; font-weight:700; color:#fff; margin-top:2px;}

  .title-frame{
    display:inline-block; margin-top:30px; padding:20px 30px 22px;
    background:rgba(0,0,0,.22); border:1.5px solid rgba(244,217,168,.5); border-radius:16px;
    backdrop-filter:blur(1px);
    opacity:0; animation:frameIn .6s ease .18s forwards;
    box-shadow:0 10px 26px -10px rgba(10,3,5,.5);
  }
  @keyframes frameIn{ from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  h1{font-size:56px; font-weight:800; margin-top:0; opacity:0; animation:fadeUp .7s ease .32s forwards; color:#fff; line-height:1.05;}
  h2{
    font-size:29px; font-weight:700; margin-top:2px; opacity:0; animation:fadeUp .7s ease .38s forwards;
    background:linear-gradient(90deg,#f2c96b,#fbe3ad,#c9962c); background-size:200% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: fadeUp .7s ease .38s forwards, goldShimmer 5s linear infinite 1.1s;
  }
  @keyframes goldShimmer{ from{background-position-x:0%;} to{background-position-x:-200%;} }

  .sub{color:#f0d9c8; font-size:16.5px; margin-top:12px; opacity:0; animation:fadeUp .7s ease .5s forwards;}

  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .badges{display:flex; align-items:center; gap:10px; margin-top:34px;}
  .badge{display:flex; flex-direction:column; align-items:center; opacity:0; animation:fadeUp .6s ease forwards;}
  .badge:nth-child(1){animation-delay:.62s;}
  .badge:nth-child(3){animation-delay:.72s;}
  .badge:nth-child(5){animation-delay:.82s;}
  .badge-circle{
    width:52px; height:52px; border-radius:9999px; background:rgba(255,255,255,.12);
    border:1.2px solid rgba(244,217,168,.55); display:flex; align-items:center; justify-content:center;
    transition:transform .2s;
  }
  .badge:hover .badge-circle{transform:translateY(-4px) scale(1.06);}
  .badge span{font-size:11px; font-weight:600; color:#f0d9c8; margin-top:8px; text-align:center;}
  .dash{width:26px; height:0; border-top:1.5px dashed rgba(244,217,168,.45); margin-top:-24px;}

  .footer-line{margin-top:30px; font-size:12.5px; font-weight:500; color:#e8c9a8; opacity:0; animation:fadeUp .7s ease .9s forwards;}

  /* right illustration */
  .illust{position:absolute; right:60px; top:60px; width:600px; height:380px;}
  .float1{position:absolute; left:40px; top:20px; animation:floatY 5.2s ease-in-out infinite;}
  @keyframes floatY{0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);}}
  .kiosk-check{animation: blinkCheck 2.4s ease-in-out infinite;}
  @keyframes blinkCheck{0%,70%,100%{opacity:1;} 85%{opacity:.15;}}
  .person{opacity:0; animation:popIn .5s ease forwards;}
  .person:nth-child(1){animation-delay:.95s;}
  .person:nth-child(2){animation-delay:1.05s;}
  .person:nth-child(3){animation-delay:1.15s;}
  @keyframes popIn{ from{opacity:0; transform:translateY(10px) scale(.9);} to{opacity:1; transform:translateY(0) scale(1);} }

  .spark{position:absolute; border-radius:9999px; background:#f2c96b; opacity:0; animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:0; transform:scale(.6);} 50%{opacity:.9; transform:scale(1.2);}}

  .wave{position:absolute; left:0; right:0; bottom:-2px; height:90px; animation:waveDrift 10s ease-in-out infinite;}

  .gear-spin{animation: spinCW 14s linear infinite; transform-origin:495px 150px;}
  .gear-spin-rev{animation: spinCCW 10s linear infinite; transform-origin:540px 190px;}
  @keyframes spinCW{ from{transform:translate(495px,150px) rotate(0deg);} to{transform:translate(495px,150px) rotate(360deg);} }
  @keyframes spinCCW{ from{transform:translate(540px,190px) rotate(0deg);} to{transform:translate(540px,190px) rotate(-360deg);} }
  @keyframes waveDrift{0%,100%{transform:translateX(0);} 50%{transform:translateX(-18px);}}
</style>
</head>
