<script src="/static/js/api.js"></script>
<script>
        initThemeToggle('theme-toggle');

        const YEAR_OPTIONS = { 'ปวช': ['1', '2', '3'], 'ปวส': ['1', '2'] };
        document.getElementById('level').addEventListener('change', (e) => {
            const yearSelect = document.getElementById('year_level');
            const years = YEAR_OPTIONS[e.target.value] || [];
            yearSelect.innerHTML = years.length
                ? years.map(y => `<option value="${y}">${y}</option>`).join('')
                : '<option value="">-- เลือกระดับชั้นก่อน --</option>';
        });

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorBox = document.getElementById('signup-error');
            const successBox = document.getElementById('signup-success');
            const btn = document.getElementById('signup-submit');
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            if (password !== confirmPassword) {
                errorBox.textContent = 'รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน';
                errorBox.classList.remove('hidden');
                return;
            }

            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> กำลังส่งข้อมูล...';
            btn.disabled = true;

            try {
                const data = await apiPostJson('/register', {
                    student_id: document.getElementById('student_id').value.trim(),
                    prefix: document.getElementById('prefix').value,
                    first_name: document.getElementById('first_name').value.trim(),
                    last_name: document.getElementById('last_name').value.trim(),
                    department: document.getElementById('department').value,
                    level: document.getElementById('level').value,
                    year_level: document.getElementById('year_level').value,
                    password,
                });
                successBox.textContent = 'สร้างบัญชีสำเร็จ กำลังพาไปยังหน้าหลัก...';
                successBox.classList.remove('hidden');
                window.location.href = data.role === 'admin' ? '/admin/dashboard' : '/dashboard';
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        });
    </script>
