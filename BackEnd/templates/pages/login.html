})();
</script>

<button class="flex-1 h-11 rounded-md font-headline-md text-body-md flex items-center justify-center gap-2 transition-all-200 text-on-surface-variant dark:text-dm-text-secondary" data-role="admin" type="button">

<script src="/static/js/api.js"></script>
<script>
        initThemeToggle('theme-toggle');

        let selectedRole = 'student';
        const ROLE_LABEL_TH = { student: 'นักศึกษา', admin: 'แอดมิน' };
        const usernameLabel = document.getElementById('username-label');
        const usernameInput = document.getElementById('username');
        const signupPrompt = document.getElementById('signup-prompt');

        function applyRoleUi(role) {
            if (role === 'admin') {
                usernameLabel.textContent = 'ชื่อผู้ใช้แอดมิน';
                usernameInput.placeholder = 'ชื่อผู้ใช้แอดมิน';
                signupPrompt.classList.add('hidden');
            } else {
                usernameLabel.textContent = 'ชื่อผู้ใช้ (รหัสนักศึกษา)';
                usernameInput.placeholder = 'ชื่อผู้ใช้บัญชีของคุณ';
                signupPrompt.classList.remove('hidden');
            }
        }
        applyRoleUi(selectedRole);

        document.querySelectorAll('#login-role-tabs button').forEach((btn) => {
            btn.addEventListener('click', () => {
                selectedRole = btn.dataset.role;
                document.querySelectorAll('#login-role-tabs button').forEach((b) => {
                    b.classList.toggle('bg-surface-white', b === btn);
                    b.classList.toggle('shadow-sm', b === btn);
                    b.classList.toggle('text-primary', b === btn);
                    b.classList.toggle('text-on-surface-variant', b !== btn);
                });
                applyRoleUi(selectedRole);
            });
        });

        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const errorBox = document.getElementById('login-error');
            const submitBtn = document.getElementById('login-submit');
            errorBox.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                const data = await apiPostJson('/login', {
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value,
                });
                if (data.role !== selectedRole) {
                    errorBox.textContent = `บัญชีนี้เป็นบัญชี${ROLE_LABEL_TH[data.role] || data.role} — กำลังพาไปยังหน้าที่ถูกต้อง`;
                    errorBox.classList.remove('hidden');
                }
                window.location.href = data.role === 'admin' ? '/admin/dashboard' : '/dashboard';
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
