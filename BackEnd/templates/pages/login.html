<style>

                transparent 12px

            background: linear-gradient(135deg, #7a2734 0%, #40000f 100%);
        }

            box-shadow: 0px 8px 24px rgba(122, 39, 52, 0.2);

            transition: all 0.2s ease-in-out;

<body class="bg-background font-body-md text-text-primary min-h-screen flex flex-col">
<header class="hero-gradient relative w-full h-[45vh] min-h-[400px] flex items-center justify-center overflow-hidden">
<div class="absolute inset-0 book-spine-pattern opacity-40"></div>
<div class="absolute top-10 left-10 opacity-10">
<span class="material-symbols-outlined text-[120px] text-on-primary">menu_book</span>
</div>
<div class="relative z-10 text-center px-gutter">
<h1 class="font-headline-xl text-headline-xl text-on-primary mb-2">NNTC Library</h1>
<p class="font-body-lg text-body-lg text-on-primary/80 max-w-xl mx-auto">
                วิทยาลัยเทคนิคนครนายก | Nakhon Nayok Technical College
            </p>
<div class="mt-4 h-1 w-24 bg-secondary-container mx-auto rounded-full"></div>
</div>
</header>
<main class="flex-grow relative px-gutter -mt-32 pb-16">
<div class="max-w-xl mx-auto">
<div class="bg-surface-white rounded-xl shadow-lg overflow-hidden border border-outline-variant/30 transition-all-200">
<div class="p-8 md:p-12">
<p id="login-error" class="hidden mb-6 rounded-lg bg-error-container text-on-error-container px-4 py-3 text-body-md"></p>
<form class="space-y-6" id="login-form">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">USERNAME</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all-200" id="username" name="username" placeholder="Your account username" required type="text"/>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">PASSWORD</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all-200" id="password" name="password" placeholder="••••••••" required type="password"/>
</div>
</div>
<button class="w-full h-14 bg-secondary text-on-secondary font-headline-md rounded-lg stamp-shadow hover:scale-[1.02] active:scale-[0.98] transition-all-200 flex items-center justify-center gap-2 group" id="login-submit" type="submit">
<span>Login to Library</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<div class="text-center pt-4">
<p class="text-body-md text-on-surface-variant">
                                No account? <a class="text-primary font-bold hover:underline" href="/signup">Sign up</a>
</p>
</div>
</form>
</div>
</div>
</div>
</main>
<footer class="bg-surface-container-highest py-8 mt-auto border-t border-outline-variant">
<div class="max-w-7xl mx-auto px-gutter flex flex-col md:flex-row justify-between items-center gap-6">
<div class="flex flex-col items-center md:items-start">
<span class="font-label-caps text-label-caps font-bold text-primary mb-2">NNTC LIBRARY</span>
<p class="font-body-md text-body-md text-on-surface-variant text-center md:text-left">
                    © 2026 Nakhon Nayok Technical College Library. All Rights Reserved.
                </p>
</div>
</div>
</footer>
<script src="/static/js/api.js"></script>
<script>
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const errorBox = document.getElementById('login-error');
            const submitBtn = document.getElementById('login-submit');
            errorBox.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                const data = await apiPostJson('/login', {
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value,
                });
                window.location.href = data.role === 'admin' ? '/admin/dashboard' : '/dashboard';
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body></html>
