<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}รายงาน{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #5c101f;
    --primary-container: #7a2734;
    --secondary: #a53d00;
    --surface: #f8f9fb;
    --surface-white: #ffffff;
    --outline-variant: #d7c3c5;
    --on-surface-variant: #554243;
    --text-secondary: #6B7280;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Noto Sans Thai', 'Tahoma', 'Leelawadee UI', sans-serif;
    margin: 0;
    color: #191c1e;
    background: var(--surface);
  }
  .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }

  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    padding: 14px 20px;
    background: var(--surface-white);
    border-bottom: 1px solid var(--outline-variant);
  }
  .toolbar button, .toolbar a {
    font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer; border: none;
  }
  .toolbar button { background: var(--primary); color: #fff; }
  .toolbar button:hover { filter: brightness(1.1); }
  .toolbar a { background: var(--surface); color: var(--primary); border: 1px solid var(--outline-variant); }
  .toolbar a:hover { background: #efe4e5; }

  header.report-head {
    background: linear-gradient(135deg, var(--primary-container) 0%, #40000f 100%);
    color: #fff;
    padding: 28px 24px 22px;
  }
  header.report-head h1 { font-size: 20px; margin: 0 0 4px; font-weight: 800; }
  header.report-head h2 { font-size: 14px; font-weight: 400; margin: 0; opacity: .85; }

  main.report-body {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 48px;
  }

  .meta {
    display: inline-block;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--on-surface-variant);
    background: var(--surface-white);
    border: 1px solid var(--outline-variant);
    border-radius: 999px;
    padding: 6px 14px;
  }

  .table-wrap {
    background: var(--surface-white);
    border: 1px solid var(--outline-variant);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,.04);
  }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 10px 14px; font-size: 13px; text-align: left; border-bottom: 1px solid var(--outline-variant); }
  th { background: var(--primary); color: #fff; font-weight: 700; white-space: nowrap; }
  tbody tr:nth-child(even) { background: var(--surface); }
  tbody tr:hover { background: #f3e6e7; }

  .empty {
    color: var(--text-secondary); font-style: italic;
    background: var(--surface-white); border: 1px dashed var(--outline-variant);
    border-radius: 12px; padding: 20px; text-align: center;
  }

  .pagination {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px; padding: 16px 14px;
    border-top: 1px solid var(--outline-variant);
    background: var(--surface-white);
  }
  .pagination button {
    min-width: 34px; height: 34px; padding: 0 8px;
    border-radius: 8px; border: 1px solid var(--outline-variant);
    background: var(--surface-white); color: var(--primary);
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .pagination button:hover { background: var(--surface); }
  .pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pagination button:disabled { opacity: .4; cursor: not-allowed; }
  .pagination .page-info { font-size: 12px; color: var(--text-secondary); margin: 0 8px; }

  @media (max-width: 640px) {
    header.report-head { padding: 22px 16px 18px; }
    main.report-body { padding: 16px 12px 32px; }
    .toolbar { padding: 12px 16px; }
  }

  @media print {
    .toolbar { display: none; }
    .pagination { display: none; }
    body { margin: 0; background: #fff; }
    header.report-head { background: #fff !important; color: #111 !important; padding: 0 0 8px; }
    header.report-head h2 { opacity: 1; color: #444; }
    main.report-body { max-width: none; padding: 12px 0; }
    .table-wrap { box-shadow: none; border-radius: 0; }
    th { background: #f0f0f0 !important; color: #111 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* Printing always includes every row, regardless of which screen page was showing. */
    .table-scroll tbody tr[data-paged] { display: table-row !important; }
  }
</style>
{% block extra_style %}{% endblock %}
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()" type="button"><span class="material-symbols-outlined" style="font-size:16px;">print</span> พิมพ์ / บันทึกเป็น PDF</button>
  {% if csv_url %}
  <a href="{{ csv_url }}"><span class="material-symbols-outlined" style="font-size:16px;">description</span> ส่งออก CSV</a>
  {% endif %}
  {% if xlsx_url %}
  <a href="{{ xlsx_url }}"><span class="material-symbols-outlined" style="font-size:16px;">grid_on</span> ส่งออก Excel</a>
  {% endif %}
  <a href="{{ url_for('admin_reports_select') }}"><span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span> เลือกเทมเพลตอื่น</a>
  <a href="/admin/dashboard"><span class="material-symbols-outlined" style="font-size:16px;">dashboard</span> กลับไปแดชบอร์ด</a>
</div>
<header class="report-head">
  <h1>วิทยาลัยเทคนิคนครนายก</h1>
  <h2>{% block subtitle %}{% endblock %}</h2>
</header>
<main class="report-body">
{% block content %}{% endblock %}
</main>
<script>
(function () {
    // Client-side pagination for long report tables (screen only — printing always
    // shows every row, see the @media print override above for [data-paged]).
    var PAGE_SIZE = 50;
    document.querySelectorAll('.table-wrap').forEach(function (wrap) {
        var tbody = wrap.querySelector('tbody');
        if (!tbody) return;
        var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
        if (rows.length <= PAGE_SIZE) return;

        rows.forEach(function (row) { row.setAttribute('data-paged', ''); });
        var pageCount = Math.ceil(rows.length / PAGE_SIZE);
        var current = 1;

        var pager = document.createElement('div');
        pager.className = 'pagination';
        wrap.appendChild(pager);

        function showPage(page) {
            current = Math.min(Math.max(page, 1), pageCount);
            rows.forEach(function (row, i) {
                row.style.display = (i >= (current - 1) * PAGE_SIZE && i < current * PAGE_SIZE) ? '' : 'none';
            });
            render();
        }

        function render() {
            pager.innerHTML = '';

            var prev = document.createElement('button');
            prev.type = 'button';
            prev.textContent = '‹ ก่อนหน้า';
            prev.disabled = current === 1;
            prev.addEventListener('click', function () { showPage(current - 1); });
            pager.appendChild(prev);

            var maxButtons = 7;
            var start = Math.max(1, current - Math.floor(maxButtons / 2));
            var end = Math.min(pageCount, start + maxButtons - 1);
            start = Math.max(1, end - maxButtons + 1);

            for (var p = start; p <= end; p++) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = String(p);
                if (p === current) btn.className = 'active';
                (function (pageNum) {
                    btn.addEventListener('click', function () { showPage(pageNum); });
                })(p);
                pager.appendChild(btn);
            }

            var next = document.createElement('button');
            next.type = 'button';
            next.textContent = 'ถัดไป ›';
            next.disabled = current === pageCount;
            next.addEventListener('click', function () { showPage(current + 1); });
            pager.appendChild(next);

            var info = document.createElement('span');
            info.className = 'page-info';
            info.textContent = 'หน้า ' + current + ' / ' + pageCount + ' (' + rows.length + ' แถวทั้งหมด)';
            pager.appendChild(info);
        }

        showPage(1);
    });
})();
</script>
</body>
</html>
