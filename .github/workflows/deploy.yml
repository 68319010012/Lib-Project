# อัปโหลดไฟล์ที่เปลี่ยนขึ้น ntclibrary.com ผ่าน FTP
#
# โครงจริงบนเซิร์ฟเวอร์ (พิสูจน์ด้วยการ LIST จริง ไม่ใช่เดาจากหน้า hPanel):
#
#   /                       <- chroot ของบัญชี u938419322.deploy
#                              = /home/u938419322/domains/ntclibrary.com
#       .env                <- ห้ามแตะ ไม่มีใน repo
#       vendor/             <- mpdf ห้ามแตะ ไม่มีใน repo
#       fonts/
#       src/                <- backend-php/src/
#       public_html/        <- document root = backend-php/public/
#
# บัญชีล็อกอินมาโผล่ที่ /public_html ไม่ใช่ราก จึงต้องใช้ %2F ระบุ path จากราก
# ของ chroot (curl ตัด ".." ออกจาก URL เอง path แบบสัมพัทธ์จึงขึ้นชั้นบนไม่ได้)
#
# ใช้ curl ตรงๆ แทน FTP-Deploy-Action เพราะลำดับการอัปสำคัญกว่าความสะดวก:
# ไฟล์ใน src/ กับ public/ พึ่งกัน การ sync ทั้งโฟลเดอร์พร้อมกันทำให้มีช่วงที่
# เว็บพัง action สั่งลำดับแบบนี้ไม่ได้
#
# ต้องตั้งใน GitHub (Settings → Secrets and variables → Actions → Secrets):
#   FTP_SERVER     ftp.ntclibrary.com
#   FTP_USERNAME   u938419322.deploy
#   FTP_PASSWORD   รหัสของบัญชีนั้น

name: Deploy to Hostinger

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ซ้อมก่อน (ไม่เขียนไฟล์จริง) — ปล่อย true ไว้ในรอบแรกเสมอ'
        type: boolean
        default: true
      confirm:
        description: 'พิมพ์ deploy เพื่อยืนยันว่าทดสอบแล้วจริง'
        required: true
        default: ''

concurrency:
  # สอง deploy พร้อมกันจะอัปทับกันจนเซิร์ฟเวอร์ค้างครึ่งๆ กลางๆ
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: ยืนยันคำสั่ง
        if: inputs.confirm != 'deploy'
        run: |
          echo "ต้องพิมพ์คำว่า deploy ในช่องยืนยันถึงจะทำงานต่อ"
          exit 1

      - uses: actions/checkout@v4

      - name: ตรวจ syntax ทุกไฟล์ PHP ก่อนอัป
        # ด่านสุดท้ายที่ถูกที่สุด ไฟล์เดียวที่ parse ไม่ผ่านทำให้ทั้งเว็บขาวได้
        # และการกู้คืนคือต้องอัปทับใหม่ผ่าน FTP ซึ่งช้ากว่าการหยุดตรงนี้มาก
        run: |
          find backend-php -name '*.php' -not -path 'backend-php/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: อัปโหลด
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$RUNNER_TEMP/netrc"

          FAIL=0
          upload() {
            rel="$1"
            case "$rel" in
              public/*) remote="%2Fpublic_html/${rel#public/}" ;;
              src/*)    remote="%2Fsrc/${rel#src/}" ;;
              *)        echo "  ข้าม (ไม่รู้ปลายทาง): $rel"; return ;;
            esac
            if [ "$DRY_RUN" = "true" ]; then
              echo "  [ซ้อม] $rel"
              return
            fi
            if curl -sS --netrc-file "$RUNNER_TEMP/netrc" --max-time 120 \
                 --ftp-create-dirs -T "backend-php/$rel" \
                 "ftp://$FTP_SERVER/$remote"; then
              echo "  ok   $rel"
            else
              echo "  FAIL $rel"; FAIL=$((FAIL+1))
            fi
          }

          # ลำดับนี้ทำให้เว็บใช้งานได้ตลอดระหว่างอัป: ของที่ถูกอ้างถึงต้องขึ้น
          # ก่อนของที่อ้างถึงมันเสมอ index.php ประกาศ route จึงต้องท้ายสุด
          upload src/constants.php
          upload public/partials/guard.php
          upload src/auth.php

          for f in $(git diff --name-only "$(git rev-parse HEAD~1)" HEAD -- backend-php/src \
                     | sed 's|^backend-php/||' | grep -v '^src/constants.php$' | grep -v '^src/auth.php$'); do
            upload "$f"
          done
          for f in $(git diff --name-only "$(git rev-parse HEAD~1)" HEAD -- backend-php/public \
                     | sed 's|^backend-php/||' | grep -v '^public/index.php$' \
                     | grep -v '^public/partials/guard.php$'); do
            upload "$f"
          done
          upload public/index.php

          rm -f "$RUNNER_TEMP/netrc"
          echo "ล้มเหลว $FAIL ไฟล์"
          exit $((FAIL > 0 ? 1 : 0))

      - name: ตรวจเว็บหลังอัป
        if: inputs.dry_run == false
        run: |
          for p in / /login /library-info; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://ntclibrary.com$p")
            echo "  $p -> $code"
          done
          # src ต้องเข้าจากเว็บไม่ได้ ถ้าวันไหนได้ 200 แปลว่าอัปผิดชั้น
          code=$(curl -s -o /dev/null -L -w '%{http_code}' --max-time 20 "https://ntclibrary.com/src/auth.php")
          if [ "$code" != "404" ]; then
            echo "เตือน: /src/auth.php ตอบ $code ควรเป็น 404"
            exit 1
          fi
          echo "  /src/auth.php -> 404 (ถูกต้อง)"
